services:

  api:
    image: ghcr.io/bsccorp/contact-form-api:latest
    restart: unless-stopped

    environment:
      NODE_ENV: production
      PORT: 3000
      MONGODB_URI: ${MONGODB_URI}
      JWT_SECRET: ${JWT_SECRET}
      EMAIL_ENCRYPTION_KEY: ${EMAIL_ENCRYPTION_KEY}

    networks:
      - app

    depends_on:
      - mongo-cf


  frontend:
    image: ghcr.io/bsccorp/contact-form-web:latest
    restart: unless-stopped

    environment:
      VIRTUAL_HOST: $VIRTUAL_HOST
      VIRTUAL_PORT: 80
      LETSENCRYPT_HOST: $VIRTUAL_HOST 
      LETSENCRYPT_EMAIL: $LETSENCRYPT_EMAIL

    networks:
      - nginx-proxy
      - app

    depends_on:
      - api


  mongo-cf:
    image: mongo:8
    restart: unless-stopped

    volumes:
      - mongo-cf-data:/data/db

    networks:
      - app


networks:

  nginx-proxy:
    external: true

  app:
    driver: bridge


volumes:
  mongo-cf-data:

