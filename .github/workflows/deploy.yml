name: Deploy

on:
  push:
    branches:
      - master

concurrency:
  group: production
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  API_IMAGE: ghcr.io/bsccorp/contact-form-api
  WEB_IMAGE: ghcr.io/bsccorp/contact-form-web

jobs:

  test:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup API
        working-directory: api
        run: npm ci

      - name: Setup frontend
        working-directory: frontend
        run: npm ci

      - name: Frontend tests
        working-directory: frontend
        run: npm run test:run

      # Add API tests here once your CI test
      # environment is configured.


  build:
    needs: test
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build API
        run: |
          docker build \
            -t $API_IMAGE:${{ github.sha }} \
            -t $API_IMAGE:latest \
            ./api

      - name: Build frontend
        run: |
          docker build \
            --build-arg VITE_API_URL=/api \
            -t $WEB_IMAGE:${{ github.sha }} \
            -t $WEB_IMAGE:latest \
            ./frontend

      - name: Push API
        run: |
          docker push $API_IMAGE:${{ github.sha }}
          docker push $API_IMAGE:latest

      - name: Push frontend
        run: |
          docker push $WEB_IMAGE:${{ github.sha }}
          docker push $WEB_IMAGE:latest


  deploy:
    needs: build
    runs-on: ubuntu-latest

    steps:

      - name: Show deployment version
        run: |
          echo "Deploying commit: ${{ github.sha }}"

      - name: Deploy
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            set -e

            cd /opt/contact-form

            export API_IMAGE_TAG="${{ github.sha }}"
            export WEB_IMAGE_TAG="${{ github.sha }}"

            echo "Deploying:"
            echo "API: ghcr.io/bsccorp/contact-form-api:${API_IMAGE_TAG}"
            echo "WEB: ghcr.io/bsccorp/contact-form-web:${WEB_IMAGE_TAG}"

            docker compose \
              -f docker-compose.prod.yml \
              pull

            docker compose \
              -f docker-compose.prod.yml \
              up -d

            echo "Deployment complete."

            docker compose \
              -f docker-compose.prod.yml \
              ps

